[project]
name = "adrobot-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=46,<51",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.41,<2.1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
